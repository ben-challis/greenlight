name: "Pull request title"

on:
  pull_request:
    types:
      - "edited"
      - "opened"
      - "reopened"
      - "synchronize"

permissions:
  pull-requests: "read"

jobs:
  title:
    name: "Conventional pull request title"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    steps:
      - name: "Validate title"
        uses: "amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6" # v6.1.2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
