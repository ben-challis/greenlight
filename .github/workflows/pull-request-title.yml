name: "Pull request title"

on:
  pull_request:
    types:
      - "edited"
      - "opened"
      - "reopened"
      - "synchronize"

permissions:
  pull-requests: "read"

jobs:
  title:
    name: "Conventional pull request title"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    steps:
      - name: "Validate title"
        uses: "amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5" # v6.1.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
