name: "Pull request title"

on:
  pull_request:
    types:
      - "edited"
      - "opened"
      - "reopened"
      - "synchronize"

permissions: {}

jobs:
  title:
    name: "Conventional pull request title"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Set up Node"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"

      - name: "Validate title"
        env:
          PULL_REQUEST_TITLE: "${{ github.event.pull_request.title }}"
        shell: "bash"
        run: >-
          printf "%s\n" "${PULL_REQUEST_TITLE}" |
          npx --yes --package=@commitlint/cli@21.2.2 -- commitlint --verbose
