name: "CI"

on:
  pull_request: ~
  merge_group: ~
  push:
    branches:
      - "main"

concurrency:
  group: "ci-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  renovate-config:
    name: "Renovate configuration"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Set up Node"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"

      - name: "Validate Renovate configuration"
        run: "npx --yes --package renovate@43.280.3 -- renovate-config-validator --strict"

  ci:
    name: "CI (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }} deps${{ matrix.symfony-version && format(', Symfony {0}', matrix.symfony-version) || '' }})"
    runs-on: "ubuntu-latest"
    # Xdebug stays off for the suite itself; the coverage acceptance tests
    # opt in per spawned process with XDEBUG_MODE=coverage.
    env:
      XDEBUG_MODE: "off"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "locked"
        # Symfony fan-out only makes sense on "highest": "lowest" always
        # resolves 6.4 and "locked" ignores SYMFONY_REQUIRE entirely.
        include:
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "6.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "7.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "8.1.*"
          - php-version: "8.5"
            dependencies: "highest"
            symfony-version: "8.1.*"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "pcntl, sockets"
          coverage: "xdebug"
          ini-values: "memory_limit=-1"

      - name: "Match Composer platform to runtime"
        if: "matrix.dependencies != 'locked' && matrix.php-version == '8.5'"
        run: "composer config platform.php 8.5.0"

      # Flex filters every symfony/* package to SYMFONY_REQUIRE during
      # resolution. Installed globally so composer.json stays untouched.
      - name: "Set up Symfony Flex"
        if: "matrix.symfony-version"
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "${{ matrix.dependencies }}"
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony-version }}"

      - name: "Static analysis"
        if: "matrix.dependencies == 'locked' && matrix.php-version == '8.4'"
        run: "composer static-analysis"

      # No phpstan on the lowest leg: the lowest allowed phpstan lacks the
      # type inference the codebase relies on (proc_open narrowing,
      # ReflectionClass variance), so every finding is tool-age noise.
      - name: "Tests"
        run: "composer tests"

  memory:
    name: "Flat-memory gate (10,000 tests, one worker)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the flat-memory gate"
        run: "composer memory-gate"

  coverage:
    name: "Self-coverage gate"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "xdebug"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the suite with coverage"
        run: "composer tests:coverage"

      - name: "Run the self-coverage gate"
        run: "composer coverage-gate"

  benchmark-harness:
    name: "Benchmark harness smoke (numbers not published)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the harness on a small parameter set"
        run: "php tools/benchmark.php --shape=many-fast --scale=1 --runs=1"

  required-checks:
    name: "Required checks"
    if: "always()"
    needs:
      - "renovate-config"
      - "ci"
      - "memory"
      - "coverage"
      - "benchmark-harness"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Verify required jobs"
        run: |
          test "${{ needs.renovate-config.result }}" = "success"
          test "${{ needs.ci.result }}" = "success"
          test "${{ needs.memory.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.benchmark-harness.result }}" = "success"
