name: "CI"

on:
  pull_request: ~
  merge_group: ~
  push:
    branches:
      - "main"
  workflow_dispatch: ~

concurrency:
  group: "ci-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

permissions: {}

jobs:
  documentation:
    name: "Build documentation"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Set up Node"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "website/package-lock.json"

      - name: "Install dependencies"
        run: "npm --prefix website ci"

      - name: "Check and build"
        run: "npm --prefix website run check"

      - name: "Upload Pages artifact"
        if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5
        with:
          path: "website/dist"

  renovate-config:
    name: "Renovate configuration"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Set up Node"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"

      - name: "Validate Renovate configuration"
        run: "npx --yes --package renovate@44.32.5 -- renovate-config-validator --strict"

  zizmor:
    name: "GitHub Actions security"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      security-events: "write" # This permission uploads results to GitHub code scanning.

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Run zizmor"
        uses: "zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054" # v0.6.2

  actionlint:
    name: "GitHub Actions workflows"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Run actionlint"
        uses: "docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"
        with:
          args: "-color"

  ci:
    name: "CI (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }} deps${{ matrix.symfony-version && format(', Symfony {0}', matrix.symfony-version) || '' }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
      id-token: "write"
    # The suite does not use Xdebug. Coverage acceptance tests set
    # XDEBUG_MODE=coverage for each process that they start.
    env:
      XDEBUG_MODE: "off"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "locked"
        # "locked" ignores SYMFONY_REQUIRE. The lowest jobs and the Symfony
        # 6.4 job remove Laravel because Laravel 13 requires Symfony >= 7.4.
        include:
          - php-version: "8.4"
            dependencies: "locked"
            analytics: true
          - php-version: "8.4"
            dependencies: "lowest"
            symfony-version: "6.4.*"
          - php-version: "8.5"
            dependencies: "lowest"
            symfony-version: "6.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "6.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "7.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "8.1.*"
          - php-version: "8.5"
            dependencies: "highest"
            symfony-version: "8.1.*"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "pcntl, sockets"
          coverage: "xdebug"
          ini-values: "memory_limit=-1"

      - name: "Match Composer platform to runtime"
        if: "matrix.dependencies != 'locked' && matrix.php-version == '8.5'"
        run: "composer config platform.php 8.5.0"

      # Symfony Flex filters every symfony/* package to SYMFONY_REQUIRE during
      # dependency resolution. CI installs Flex globally and does not change
      # composer.json.
      - name: "Set up Symfony Flex"
        if: "matrix.symfony-version"
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      # laravel/framework 13 requires symfony/* >= 7.4, so it cannot install
      # next to Symfony 6.4. The Laravel tests skip through their
      # ClassAvailable condition when Illuminate is absent.
      - name: "Remove Laravel on Symfony 6.4"
        if: "matrix.symfony-version == '6.4.*'"
        run: "composer remove --dev --no-update --no-interaction laravel/framework"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "${{ matrix.dependencies }}"
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony-version }}"

      - name: "Calculate static analysis cache content hash"
        id: "analysis_cache"
        if: "matrix.dependencies == 'locked' && matrix.php-version == '8.4'"
        env:
          CONTENT_HASH: "${{ hashFiles('composer.lock', '.php-cs-fixer.dist.php', 'deptrac.yaml', 'extension.neon', 'phpstan.dist.neon', 'rector.php') }}"
        run: 'echo "content_hash=${CONTENT_HASH}" >> "${GITHUB_OUTPUT}"'

      - name: "Restore static analysis cache"
        if: "matrix.dependencies == 'locked' && matrix.php-version == '8.4'"
        uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
        with:
          path: |
            .deptrac.cache
            .php-cs-fixer.cache
            build/cache/phpstan
            build/cache/rector
          key: "static-analysis-${{ runner.os }}-php-${{ matrix.php-version }}-${{ steps.analysis_cache.outputs.content_hash }}-${{ github.run_id }}"
          restore-keys: "static-analysis-${{ runner.os }}-php-${{ matrix.php-version }}-${{ steps.analysis_cache.outputs.content_hash }}-"

      - name: "Static analysis"
        if: "matrix.dependencies == 'locked' && matrix.php-version == '8.4'"
        run: "composer static-analysis"

      - name: "Save static analysis cache"
        if: "${{ !cancelled() && matrix.dependencies == 'locked' && matrix.php-version == '8.4' }}"
        uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
        with:
          path: |
            .deptrac.cache
            .php-cs-fixer.cache
            build/cache/phpstan
            build/cache/rector
          key: "static-analysis-${{ runner.os }}-php-${{ matrix.php-version }}-${{ steps.analysis_cache.outputs.content_hash }}-${{ github.run_id }}"

      # PHPStan does not run in the "lowest" jobs. The oldest permitted PHPStan
      # cannot infer types that the code requires. Examples include the
      # proc_open return type and ReflectionClass variance. Consequently, all PHPStan
      # reports in these jobs are false.
      - name: "Tests"
        if: "matrix.analytics != true"
        run: "composer tests"

      - name: "Tests with JUnit output"
        if: "matrix.analytics == true"
        run: |
          mkdir -p build/test-results
          php bin/greenlight run --reporter=junit > build/test-results/greenlight.junit.xml

      - name: "Upload test results to Codecov"
        if: "${{ !cancelled() && matrix.analytics == true }}"
        continue-on-error: true
        uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: "build/test-results/greenlight.junit.xml"
          report_type: "test_results"
          use_oidc: true

  macos-portability:
    name: "macOS portability smoke"
    runs-on: "macos-15"
    timeout-minutes: 10
    permissions:
      contents: "read"
    env:
      XDEBUG_MODE: "off"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the portability smoke tests"
        run: |
          php bin/greenlight run \
            --filter=CpuCoresTest \
            --filter=InterruptionTest \
            --filter=ReporterSmokeTest \
            --filter=ServerSocketTest \
            --filter=SocketChannelTest \
            --filter=SuitePathDiscoveryTest \
            --filter=TempDirectoryRootSymbolicLinkTest \
            --filter=TempDirectorySubdirectoryLinkTest \
            --filter=TerminalTest \
            --filter=WorkerProcessRunTest

  memory:
    name: "Flat-memory gate (10,000 tests, one worker)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the flat-memory gate"
        run: "composer memory-gate"

  coverage:
    name: "Self-coverage gate"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "xdebug"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the suite with coverage"
        run: "composer tests:coverage"

      - name: "Upload coverage to Codecov"
        continue-on-error: true
        uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: "build/coverage/cobertura.xml"
          use_oidc: true

      - name: "Run the self-coverage gate"
        if: "always()"
        run: "composer coverage-gate"

  pcov:
    name: "PCOV coverage integration"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "pcov"
          ini-values: "memory_limit=-1, pcov.directory=${{ github.workspace }}/tests/Fixture/CoverageLib"

      - name: "Verify the coverage driver"
        run: "php -r 'exit(extension_loaded(\"pcov\") && !extension_loaded(\"xdebug\") ? 0 : 1);'"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Collect and export coverage with PCOV"
        run: "php bin/greenlight run --filter='Greenlight\\Tests\\Acceptance\\CoverageRunTest::collectsAndExportsCoverageThroughTheProcessPool'"

  benchmark-harness:
    name: "Benchmark harness smoke (numbers not published)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the harness on a small parameter set"
        run: "php tools/benchmark.php --shape=many-fast --scale=1 --runs=1"

  deploy-documentation:
    name: "Deploy documentation"
    if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
    needs:
      - "documentation"
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      pages: "write"
      id-token: "write"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"

    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128" # v5

  required-checks:
    name: "Required checks"
    if: "always()"
    needs:
      - "documentation"
      - "renovate-config"
      - "zizmor"
      - "actionlint"
      - "ci"
      - "macos-portability"
      - "memory"
      - "coverage"
      - "pcov"
      - "benchmark-harness"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    steps:
      - name: "Verify required jobs"
        env:
          ACTIONLINT_RESULT: "${{ needs.actionlint.result }}"
          BENCHMARK_HARNESS_RESULT: "${{ needs.benchmark-harness.result }}"
          CI_RESULT: "${{ needs.ci.result }}"
          COVERAGE_RESULT: "${{ needs.coverage.result }}"
          DOCUMENTATION_RESULT: "${{ needs.documentation.result }}"
          MACOS_PORTABILITY_RESULT: "${{ needs.macos-portability.result }}"
          MEMORY_RESULT: "${{ needs.memory.result }}"
          PCOV_RESULT: "${{ needs.pcov.result }}"
          RENOVATE_CONFIG_RESULT: "${{ needs.renovate-config.result }}"
          ZIZMOR_RESULT: "${{ needs.zizmor.result }}"
        run: |
          test "${DOCUMENTATION_RESULT}" = "success"
          test "${RENOVATE_CONFIG_RESULT}" = "success"
          test "${ZIZMOR_RESULT}" = "success"
          test "${ACTIONLINT_RESULT}" = "success"
          test "${CI_RESULT}" = "success"
          test "${MACOS_PORTABILITY_RESULT}" = "success"
          test "${MEMORY_RESULT}" = "success"
          test "${COVERAGE_RESULT}" = "success"
          test "${PCOV_RESULT}" = "success"
          test "${BENCHMARK_HARNESS_RESULT}" = "success"
