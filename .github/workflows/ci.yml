name: "CI"

on:
  pull_request: ~
  merge_group: ~
  push:
    branches:
      - "main"
  workflow_dispatch: ~

concurrency:
  group: "ci-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  documentation:
    name: "Build documentation"
    runs-on: "ubuntu-latest"
    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Set up Node"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "website/package-lock.json"

      - name: "Install dependencies"
        run: "npm --prefix website ci"

      - name: "Check and build"
        run: "npm --prefix website run check"

      - name: "Upload Pages artifact"
        if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5
        with:
          path: "website/dist"

  renovate-config:
    name: "Renovate configuration"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Set up Node"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"

      - name: "Validate Renovate configuration"
        run: "npx --yes --package renovate@43.284.1 -- renovate-config-validator --strict"

  ci:
    name: "CI (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }} deps${{ matrix.symfony-version && format(', Symfony {0}', matrix.symfony-version) || '' }})"
    runs-on: "ubuntu-latest"
    # The suite does not use Xdebug. Coverage acceptance tests set
    # XDEBUG_MODE=coverage for each process that they start.
    env:
      XDEBUG_MODE: "off"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "locked"
        # "locked" ignores SYMFONY_REQUIRE. The lowest jobs and the Symfony
        # 6.4 job remove Laravel because Laravel 13 requires Symfony >= 7.4.
        include:
          - php-version: "8.4"
            dependencies: "lowest"
            symfony-version: "6.4.*"
          - php-version: "8.5"
            dependencies: "lowest"
            symfony-version: "6.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "6.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "7.4.*"
          - php-version: "8.4"
            dependencies: "highest"
            symfony-version: "8.1.*"
          - php-version: "8.5"
            dependencies: "highest"
            symfony-version: "8.1.*"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "pcntl, sockets"
          coverage: "xdebug"
          ini-values: "memory_limit=-1"

      - name: "Match Composer platform to runtime"
        if: "matrix.dependencies != 'locked' && matrix.php-version == '8.5'"
        run: "composer config platform.php 8.5.0"

      # Symfony Flex filters every symfony/* package to SYMFONY_REQUIRE during
      # dependency resolution. CI installs Flex globally and does not change
      # composer.json.
      - name: "Set up Symfony Flex"
        if: "matrix.symfony-version"
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      # laravel/framework 13 requires symfony/* >= 7.4, so it cannot install
      # next to Symfony 6.4. The Laravel tests skip through their
      # ClassAvailable condition when Illuminate is absent.
      - name: "Remove Laravel on Symfony 6.4"
        if: "matrix.symfony-version == '6.4.*'"
        run: "composer remove --dev --no-update --no-interaction laravel/framework"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "${{ matrix.dependencies }}"
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony-version }}"

      - name: "Static analysis"
        if: "matrix.dependencies == 'locked' && matrix.php-version == '8.4'"
        run: "composer static-analysis"

      # PHPStan does not run in the "lowest" jobs. The oldest permitted PHPStan
      # cannot infer types that the code requires. Examples include the
      # proc_open return type and ReflectionClass variance. Consequently, all PHPStan
      # reports in these jobs are false.
      - name: "Tests"
        run: "composer tests"

  memory:
    name: "Flat-memory gate (10,000 tests, one worker)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the flat-memory gate"
        run: "composer memory-gate"

  coverage:
    name: "Self-coverage gate"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          extensions: "pcntl, sockets"
          coverage: "xdebug"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the suite with coverage"
        run: "composer tests:coverage"

      - name: "Upload coverage to Codecov"
        continue-on-error: true
        uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: "build/coverage/cobertura.xml"
          use_oidc: true

      - name: "Run the self-coverage gate"
        if: "always()"
        run: "composer coverage-gate"

  benchmark-harness:
    name: "Benchmark harness smoke (numbers not published)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "8.4"
          coverage: "none"
          ini-values: "memory_limit=-1"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Run the harness on a small parameter set"
        run: "php tools/benchmark.php --shape=many-fast --scale=1 --runs=1"

  deploy-documentation:
    name: "Deploy documentation"
    if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
    needs:
      - "documentation"
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: "ubuntu-latest"
    permissions:
      pages: "write"
      id-token: "write"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"

    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128" # v5

  required-checks:
    name: "Required checks"
    if: "always()"
    needs:
      - "documentation"
      - "renovate-config"
      - "ci"
      - "memory"
      - "coverage"
      - "benchmark-harness"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Verify required jobs"
        run: |
          test "${{ needs.documentation.result }}" = "success"
          test "${{ needs.renovate-config.result }}" = "success"
          test "${{ needs.ci.result }}" = "success"
          test "${{ needs.memory.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.benchmark-harness.result }}" = "success"
