name: "PHP-Fuzzer campaign"

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch: ~

concurrency:
  group: "php-fuzzing"
  cancel-in-progress: true

permissions: {}

jobs:
  fuzz:
    name: "Fuzz ${{ matrix.target }} on PHP ${{ matrix.php-version }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 12
    permissions:
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
        target:
          - "artifact-sidecar"
          - "discovery-cache-entry"
          - "frame-stream"
          - "json-frame"
          - "protocol-message"
          - "wire-message"
    env:
      FUZZ_PHP_VERSION: "${{ matrix.php-version }}"
      FUZZ_TARGET: "${{ matrix.target }}"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "pcntl"
          coverage: "none"
          ini-values: "memory_limit=512M"

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Install PHP-Fuzzer"
        shell: "bash"
        run: |
          set -euo pipefail
          readonly php_fuzzer="${RUNNER_TEMP}/php-fuzzer-v0.0.11.phar"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output "${php_fuzzer}" \
            https://github.com/nikic/PHP-Fuzzer/releases/download/v0.0.11/php-fuzzer.phar
          printf '%s  %s\n' \
            '8e8af960a993042b392b98927e9cb40237d466c22f0fc10feab2a40b1d679177' \
            "${php_fuzzer}" \
            | sha256sum --check --strict

      - name: "Restore the evolving corpus"
        uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
        with:
          path: "build/fuzz/${{ matrix.target }}/corpus"
          key: "php-fuzzer-v1-${{ runner.os }}-${{ matrix.php-version }}-${{ matrix.target }}-${{ github.run_id }}"
          restore-keys: |
            php-fuzzer-v1-${{ runner.os }}-${{ matrix.php-version }}-${{ matrix.target }}-

      - name: "Run the fuzz campaign"
        shell: "bash"
        run: |
          set -euo pipefail

          readonly fuzz_directory="${GITHUB_WORKSPACE}/build/fuzz/${FUZZ_TARGET}"
          readonly php_fuzzer="${RUNNER_TEMP}/php-fuzzer-v0.0.11.phar"
          readonly target="${GITHUB_WORKSPACE}/tools/fuzz/${FUZZ_TARGET}.php"
          readonly dictionary="${GITHUB_WORKSPACE}/tools/fuzz/json.dict"

          mkdir -p "${fuzz_directory}/corpus"
          cp --no-clobber \
            "${GITHUB_WORKSPACE}/tools/fuzz/corpus/${FUZZ_TARGET}/"* \
            "${fuzz_directory}/corpus/"
          cd "${fuzz_directory}"

          set +e
          timeout --signal=INT --kill-after=10s 4m \
            php "${php_fuzzer}" fuzz \
              --dict "${dictionary}" \
              --timeout 2 \
              "${target}" \
              corpus
          campaign_status=$?
          set -e

          shopt -s nullglob
          crashes=(crash-*.txt)

          if [[ "${#crashes[@]}" -gt 0 ]]; then
            timeout --signal=INT --kill-after=10s 1m \
              php "${php_fuzzer}" minimize-crash \
                --dict "${dictionary}" \
                --max-runs 10000 \
                --timeout 2 \
                "${target}" \
                "${crashes[0]}" \
              || true

            printf 'PHP-Fuzzer found %s crash input(s).\n' "${#crashes[@]}" >&2
            exit 1
          fi

          if [[ "${campaign_status}" -ne 0 && "${campaign_status}" -ne 124 && "${campaign_status}" -ne 130 ]]; then
            printf 'PHP-Fuzzer stopped with status %s.\n' "${campaign_status}" >&2
            exit "${campaign_status}"
          fi

          timeout --signal=INT --kill-after=10s 2m \
            php "${php_fuzzer}" report-coverage \
              --dict "${dictionary}" \
              --max-runs 50000 \
              --timeout 2 \
              "${target}" \
              corpus \
              coverage

          corpus_files="$(find corpus -type f | wc -l)"
          corpus_bytes="$(du --bytes --summarize corpus | cut --fields=1)"
          {
            printf '### %s on PHP %s\n\n' "${FUZZ_TARGET}" "${FUZZ_PHP_VERSION}"
            printf -- '- Corpus inputs: %s\n' "${corpus_files}"
            printf -- '- Corpus bytes: %s\n' "${corpus_bytes}"
            printf -- '- Campaign duration: 4 minutes\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: "Upload the working corpus and crashes"
        if: "always()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          name: "fuzz-${{ matrix.target }}-php-${{ matrix.php-version }}-${{ github.run_id }}"
          path: "build/fuzz/${{ matrix.target }}"
          if-no-files-found: "error"
          retention-days: 14
