name: "Release Please"

on:
  push:
    branches:
      - "main"
  workflow_dispatch: ~

concurrency:
  group: "release-please"

permissions:
  contents: "write"
  issues: "write"
  pull-requests: "write"

jobs:
  release-please:
    name: "Prepare or publish a release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    steps:
      - name: "Run Release Please"
        uses: "googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7" # v5.0.0
