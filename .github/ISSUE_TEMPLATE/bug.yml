name: Bug report
description: Report a defect in Greenlight
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest test class, configuration, and command that reproduce the problem.
      placeholder: |
        ```php
        // test class and configuration here
        ```
        Command: bin/greenlight ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: If available, include the full output or a stack trace.
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.5"
    validations:
      required: true
  - type: input
    id: greenlight-version
    attributes:
      label: Greenlight version
      placeholder: "For example, 0.1.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "For example, Ubuntu 24.04 or macOS 26"
    validations:
      required: true
