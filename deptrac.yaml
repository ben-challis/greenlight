deptrac:
  paths:
    - src

  analyser:
    types:
      - class
      - class_superglobal
      - use
      - file
      - function
      - function_call
      - function_superglobal

  layers:
    - name: Wire
      collectors:
        - type: directory
          value: src/Wire/.*
    - name: InternalFilesystem
      collectors:
        - type: directory
          value: src/Internal/Filesystem/.*
    - name: InternalText
      collectors:
        - type: directory
          value: src/Internal/Text/.*
    - name: InternalProcess
      collectors:
        - type: directory
          value: src/Internal/Process/.*
    - name: InternalPhp
      collectors:
        - type: directory
          value: src/Internal/Php/.*
    - name: Artifact
      collectors:
        - type: directory
          value: src/Artifact/.*
    - name: Result
      collectors:
        - type: directory
          value: src/Result/.*
    - name: Event
      collectors:
        - type: directory
          value: src/Event/.*
    - name: Attribute
      collectors:
        - type: directory
          value: src/Attribute/.*
    - name: Condition
      collectors:
        - type: directory
          value: src/Condition/.*
    - name: Test
      collectors:
        - type: directory
          value: src/Test/.*
    - name: Config
      collectors:
        - type: directory
          value: src/Config/.*
    - name: Discovery
      collectors:
        - type: directory
          value: src/Discovery/.*
    - name: Expect
      collectors:
        - type: directory
          value: src/Expect/.*
    - name: Capture
      collectors:
        - type: directory
          value: src/Capture/.*
    - name: Harness
      collectors:
        - type: directory
          value: src/Harness/.*
    - name: Doubles
      collectors:
        - type: directory
          value: src/Doubles/.*
    - name: Sandbox
      collectors:
        - type: directory
          value: src/Sandbox/.*
    - name: Coverage
      collectors:
        - type: directory
          value: src/Coverage/.*
    - name: Plugin
      collectors:
        - type: directory
          value: src/Plugin/.*
    - name: Reporting
      collectors:
        - type: directory
          value: src/Reporting/.*
    - name: Runner
      collectors:
        - type: directory
          value: src/Runner/.*
    - name: Cli
      collectors:
        - type: directory
          value: src/Cli/.*
    - name: PhpStan
      collectors:
        - type: directory
          value: src/PhpStan/.*
    - name: Rector
      collectors:
        - type: directory
          value: src/Rector/.*
    - name: Documentation
      collectors:
        - type: directory
          value: src/Documentation/.*
    - name: Symfony
      collectors:
        - type: directory
          value: src/Symfony/.*
    - name: Laravel
      collectors:
        - type: directory
          value: src/Laravel/.*
    - name: Hyperf
      collectors:
        - type: directory
          value: src/Hyperf/.*
    - name: Psr
      collectors:
        - type: directory
          value: src/Psr/.*
    - name: Psr15
      collectors:
        - type: directory
          value: src/Psr15/.*
    - name: Tempest
      collectors:
        - type: directory
          value: src/Tempest/.*
    - name: PhpStanFramework
      collectors:
        - type: classNameRegex
          value: /^PHPStan\\/
    - name: SymfonyFramework
      collectors:
        - type: classNameRegex
          value: /^Symfony\\(Component\\(DependencyInjection|HttpKernel)|Contracts\\Service)\\/
    - name: LaravelFramework
      collectors:
        - type: classNameRegex
          value: /^Illuminate\\/
    - name: HyperfFramework
      collectors:
        - type: classNameRegex
          value: /^Hyperf\\/
    - name: SwooleFramework
      collectors:
        - type: classNameRegex
          value: /^Swoole\\/
    - name: ComposerRuntime
      collectors:
        - type: classNameRegex
          value: /^Composer\\InstalledVersions$/
    - name: PsrFramework
      collectors:
        - type: classNameRegex
          value: /^Psr\\Container\\/
    - name: PsrHttpFramework
      collectors:
        - type: classNameRegex
          value: /^Psr\\Http\\(Message|Server)\\/
    - name: TempestFramework
      collectors:
        - type: classNameRegex
          value: /^Tempest\\/
    - name: CpuCoreCounter
      collectors:
        - type: classNameRegex
          value: /^Fidry\\CpuCoreCounter\\/
    - name: PhpParserFramework
      collectors:
        - type: classNameRegex
          value: /^PhpParser\\/
    - name: RectorFramework
      collectors:
        - type: classNameRegex
          value: /^Rector\\/
        - type: classNameRegex
          value: /^Symplify\\RuleDocGenerator\\/

  ruleset:
    Wire: []
    InternalFilesystem: [InternalPhp]
    InternalText: []
    InternalProcess: []
    InternalPhp: []
    Artifact: [Wire]
    Test: [InternalText, Wire]
    Condition: [InternalProcess]
    Result: [Artifact, InternalText, Test, Wire]
    Event: [Result, Test, Wire]
    Attribute: [Condition, Test]
    Config: [InternalPhp, InternalText, Plugin, Result, Test, Wire]
    Discovery: [Attribute, InternalFilesystem, InternalPhp, Test, Wire]
    Expect: [InternalPhp, Plugin, Result, Test, Wire]
    Capture: [InternalPhp, Result, Wire]
    Harness: [Wire]
    Doubles: [Expect, Harness, InternalFilesystem, InternalPhp, Result, Test]
    Sandbox: [Harness, InternalPhp, InternalProcess]
    Coverage: [InternalPhp, Wire]
    Plugin: [Artifact, Event, Harness, Reporting, Result, Test]
    Reporting: [Artifact, Event, InternalPhp, Result, Test, Wire]
    Runner: [Artifact, Attribute, Capture, Condition, Config, Coverage, Discovery, Doubles, Event, Expect, Harness, InternalPhp, InternalProcess, InternalText, Plugin, Reporting, Result, Sandbox, Test, Wire, CpuCoreCounter]
    Cli: [Artifact, Config, Coverage, Discovery, Event, InternalFilesystem, InternalPhp, InternalProcess, InternalText, PhpStan, Plugin, Reporting, Result, Runner, Test, Wire]
    PhpStan: [Attribute, Condition, Config, Doubles, Expect, InternalPhp, Test, PhpStanFramework, PhpParserFramework]
    Rector: [Attribute, Condition, Expect, Test, PhpParserFramework, RectorFramework]
    Documentation: []
    Symfony: [Harness, Plugin, Result, SymfonyFramework]
    Laravel: [Harness, InternalPhp, InternalProcess, Plugin, Result, LaravelFramework]
    Hyperf: [Harness, InternalPhp, Plugin, HyperfFramework, PsrFramework, SwooleFramework, ComposerRuntime]
    Psr: [Harness, Plugin, Result, PsrFramework]
    Psr15: [Harness, Plugin, PsrHttpFramework]
    Tempest: [Harness, InternalProcess, Plugin, Result, Test, TempestFramework]
    PhpStanFramework: []
    SymfonyFramework: []
    LaravelFramework: []
    HyperfFramework: []
    SwooleFramework: []
    ComposerRuntime: []
    PsrFramework: []
    PsrHttpFramework: []
    TempestFramework: []
    CpuCoreCounter: []
    PhpParserFramework: []
    RectorFramework: []
