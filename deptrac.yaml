deptrac:
  paths:
    - src

  analyser:
    types:
      - class
      - class_superglobal
      - use
      - file
      - function
      - function_call
      - function_superglobal

  layers:
    - name: Core
      collectors:
        - type: directory
          value: src/Core/.*
    - name: Attribute
      collectors:
        - type: directory
          value: src/Attribute/.*
    - name: Condition
      collectors:
        - type: directory
          value: src/Condition/.*
    - name: Config
      collectors:
        - type: directory
          value: src/Config/.*
    - name: Discovery
      collectors:
        - type: directory
          value: src/Discovery/.*
    - name: Expect
      collectors:
        - type: directory
          value: src/Expect/.*
    - name: Capture
      collectors:
        - type: directory
          value: src/Capture/.*
    - name: Harness
      collectors:
        - type: directory
          value: src/Harness/.*
    - name: Doubles
      collectors:
        - type: directory
          value: src/Doubles/.*
    - name: Fixture
      collectors:
        - type: directory
          value: src/Fixture/.*
    - name: Coverage
      collectors:
        - type: directory
          value: src/Coverage/.*
    - name: Plugin
      collectors:
        - type: directory
          value: src/Plugin/.*
    - name: Reporting
      collectors:
        - type: directory
          value: src/Reporting/.*
    - name: Runner
      collectors:
        - type: directory
          value: src/Runner/.*
    - name: Cli
      collectors:
        - type: directory
          value: src/Cli/.*
    - name: PhpStan
      collectors:
        - type: directory
          value: src/PhpStan/.*
    - name: Rector
      collectors:
        - type: directory
          value: src/Rector/.*
    - name: Symfony
      collectors:
        - type: directory
          value: src/Symfony/.*
    - name: PhpStanFramework
      collectors:
        - type: classNameRegex
          value: /^PHPStan\\/
    - name: SymfonyFramework
      collectors:
        - type: classNameRegex
          value: /^Symfony\\(Component\\(DependencyInjection|HttpKernel)|Contracts\\Service)\\/
    - name: CpuCoreCounter
      collectors:
        - type: classNameRegex
          value: /^Fidry\\CpuCoreCounter\\/
    - name: PhpParserFramework
      collectors:
        - type: classNameRegex
          value: /^PhpParser\\/
    - name: RectorFramework
      collectors:
        - type: classNameRegex
          value: /^Rector\\/
        - type: classNameRegex
          value: /^Symplify\\RuleDocGenerator\\/

  ruleset:
    Core: []
    Attribute: [Core]
    Condition: [Core]
    Config: [Core, Plugin]
    Discovery: [Core, Attribute]
    Expect: [Core, Plugin]
    Capture: [Core]
    Harness: [Core]
    Doubles: [Core, Expect, Harness]
    Fixture: [Core, Harness]
    Coverage: [Core]
    Plugin: [Core, Harness]
    Reporting: [Core]
    Runner: [Core, Attribute, Config, Discovery, Expect, Capture, Harness, Doubles, Fixture, Coverage, Plugin, Reporting, CpuCoreCounter]
    Cli: [Core, Config, Coverage, Discovery, Reporting, Runner, PhpStan]
    PhpStan: [Core, Attribute, Config, Expect, PhpStanFramework, PhpParserFramework]
    Rector: [Core, Attribute, Condition, Expect, PhpStanFramework, PhpParserFramework, RectorFramework]
    Symfony: [Core, Harness, Plugin, SymfonyFramework]
    PhpStanFramework: []
    SymfonyFramework: []
    CpuCoreCounter: []
    PhpParserFramework: []
    RectorFramework: []
