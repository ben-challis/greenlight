deptrac:
  paths:
    - src

  analyser:
    types:
      - class
      - class_superglobal
      - use
      - file
      - function
      - function_call
      - function_superglobal

  layers:
    - name: InternalEvent
      collectors:
        - type: directory
          value: src/Internal/Event/.*
    - name: InternalWire
      collectors:
        - type: directory
          value: src/Internal/Wire/.*
    - name: InternalFilesystem
      collectors:
        - type: directory
          value: src/Internal/Filesystem/.*
    - name: InternalText
      collectors:
        - type: directory
          value: src/Internal/Text/.*
    - name: InternalProcess
      collectors:
        - type: directory
          value: src/Internal/Process/.*
    - name: InternalPhp
      collectors:
        - type: directory
          value: src/Internal/Php/.*
    - name: Artifact
      collectors:
        - type: directory
          value: src/Artifact/.*
    - name: Result
      collectors:
        - type: directory
          value: src/Result/.*
    - name: Event
      collectors:
        - type: directory
          value: src/Event/.*
    - name: Attribute
      collectors:
        - type: directory
          value: src/Attribute/.*
    - name: Condition
      collectors:
        - type: directory
          value: src/Condition/.*
    - name: Test
      collectors:
        - type: directory
          value: src/Test/[^/]+\.php
    - name: TestDataSet
      collectors:
        - type: directory
          value: src/Test/DataSet/.*
    - name: Config
      collectors:
        - type: directory
          value: src/Config/.*
    - name: Discovery
      collectors:
        - type: directory
          value: src/Discovery/[^/]+\.php
    - name: DiscoveryPlan
      collectors:
        - type: directory
          value: src/Discovery/Plan/.*
    - name: Expect
      collectors:
        - type: directory
          value: src/Expect/.*
    - name: Harness
      collectors:
        - type: directory
          value: src/Harness/.*
    - name: IntegrationFixture
      collectors:
        - type: directory
          value: src/IntegrationFixture/.*
    - name: Doubles
      collectors:
        - type: directory
          value: src/Doubles/.*
    - name: Sandbox
      collectors:
        - type: directory
          value: src/Sandbox/.*
    - name: CoverageCollection
      collectors:
        - type: directory
          value: src/Coverage/Collection/.*
    - name: CoverageDiff
      collectors:
        - type: directory
          value: src/Coverage/Diff/.*
    - name: CoverageAttribution
      collectors:
        - type: directory
          value: src/Coverage/Attribution/.*
    - name: CoverageExport
      collectors:
        - type: directory
          value: src/Coverage/Export/.*
    - name: CoverageIgnore
      collectors:
        - type: directory
          value: src/Coverage/Ignore/.*
    - name: CoverageRelay
      collectors:
        - type: directory
          value: src/Coverage/Relay/.*
    - name: Coverage
      collectors:
        - type: directory
          value: src/Coverage/[^/]+\.php
    - name: Plugin
      collectors:
        - type: directory
          value: src/Plugin/.*
    - name: Reporting
      collectors:
        - type: directory
          value: src/Reporting/[^/]+\.php
    - name: ReportingProfile
      collectors:
        - type: directory
          value: src/Reporting/Profile/.*
    - name: Execution
      collectors:
        - type: directory
          value: src/Execution/[^/]+\.php
    - name: ExecutionAdapter
      collectors:
        - type: directory
          value: src/Execution/Adapter/.*
    - name: ExecutionArtifact
      collectors:
        - type: directory
          value: src/Execution/Artifact/.*
    - name: ExecutionPlugin
      collectors:
        - type: directory
          value: src/Execution/Plugin/.*
    - name: ExecutionWorker
      collectors:
        - type: directory
          value: src/Execution/Worker/.*
    - name: ExecutionProcessProtocol
      collectors:
        - type: directory
          value: src/Execution/ProcessPool/Protocol/.*
    - name: ExecutionProcessWorker
      collectors:
        - type: directory
          value: src/Execution/ProcessPool/Worker/.*
    - name: ExecutionProcessOrchestrator
      collectors:
        - type: directory
          value: src/Execution/ProcessPool/Orchestrator/.*
    - name: Cli
      collectors:
        - type: directory
          value: src/Cli/[^/]+\.php
    - name: CliInput
      collectors:
        - type: directory
          value: src/Cli/Input/.*
    - name: CliConfiguration
      collectors:
        - type: directory
          value: src/Cli/Configuration/.*
    - name: CliDiscovery
      collectors:
        - type: directory
          value: src/Cli/Discovery/.*
    - name: CliOutput
      collectors:
        - type: directory
          value: src/Cli/Output/.*
    - name: CliReporting
      collectors:
        - type: directory
          value: src/Cli/Reporting/.*
    - name: CliCoverage
      collectors:
        - type: directory
          value: src/Cli/Coverage/.*
    - name: CliSignal
      collectors:
        - type: directory
          value: src/Cli/Signal/.*
    - name: CliState
      collectors:
        - type: directory
          value: src/Cli/State/.*
    - name: CliWatch
      collectors:
        - type: directory
          value: src/Cli/Watch/.*
    - name: CliWorkerCapacity
      collectors:
        - type: directory
          value: src/Cli/WorkerCapacity/.*
    - name: CliCommand
      collectors:
        - type: directory
          value: src/Cli/Command/.*
    - name: CliRun
      collectors:
        - type: directory
          value: src/Cli/Run/.*
    - name: PhpStan
      collectors:
        - type: directory
          value: src/PhpStan/.*
    - name: Rector
      collectors:
        - type: directory
          value: src/Rector/.*
    - name: Documentation
      collectors:
        - type: directory
          value: src/Documentation/.*
    - name: Symfony
      collectors:
        - type: directory
          value: src/Symfony/.*
    - name: Laravel
      collectors:
        - type: directory
          value: src/Laravel/.*
    - name: Hyperf
      collectors:
        - type: directory
          value: src/Hyperf/.*
    - name: Psr11
      collectors:
        - type: directory
          value: src/Psr11/.*
    - name: Psr15
      collectors:
        - type: directory
          value: src/Psr15/.*
    - name: Tempest
      collectors:
        - type: directory
          value: src/Tempest/.*
    - name: PhpStanFramework
      collectors:
        - type: classNameRegex
          value: /^PHPStan\\/
    - name: SymfonyFramework
      collectors:
        - type: classNameRegex
          value: /^Symfony\\(Component\\(DependencyInjection|HttpKernel)|Contracts\\Service)\\/
    - name: LaravelFramework
      collectors:
        - type: classNameRegex
          value: /^Illuminate\\/
    - name: HyperfFramework
      collectors:
        - type: classNameRegex
          value: /^Hyperf\\/
    - name: SwooleFramework
      collectors:
        - type: classNameRegex
          value: /^Swoole\\/
    - name: ComposerRuntime
      collectors:
        - type: classNameRegex
          value: /^Composer\\InstalledVersions$/
    - name: PsrContainerFramework
      collectors:
        - type: classNameRegex
          value: /^Psr\\Container\\/
    - name: PsrHttpFramework
      collectors:
        - type: classNameRegex
          value: /^Psr\\Http\\(Message|Server)\\/
    - name: TempestFramework
      collectors:
        - type: classNameRegex
          value: /^Tempest\\/
    - name: CpuCoreCounter
      collectors:
        - type: classNameRegex
          value: /^Fidry\\CpuCoreCounter\\/
    - name: PhpParserFramework
      collectors:
        - type: classNameRegex
          value: /^PhpParser\\/
    - name: RectorFramework
      collectors:
        - type: classNameRegex
          value: /^Rector\\/
        - type: classNameRegex
          value: /^Symplify\\RuleDocGenerator\\/

  ruleset:
    InternalEvent: [Event, InternalWire]
    InternalWire: []
    InternalFilesystem: [InternalPhp]
    InternalText: []
    InternalProcess: []
    InternalPhp: []
    Artifact: [InternalWire]
    Test: [InternalText, InternalWire]
    TestDataSet: [Attribute, InternalPhp]
    Condition: [InternalProcess]
    Result: [Artifact, InternalText, InternalWire, Test]
    Event: [InternalWire, Result, Test]
    Attribute: [Condition, Test]
    Config: [InternalPhp, InternalText, InternalWire, Plugin, Result, Test]
    Discovery: [Attribute, DiscoveryPlan, InternalFilesystem, InternalPhp, InternalWire, Test, TestDataSet]
    DiscoveryPlan: [Attribute, InternalWire, Test]
    Expect: [InternalPhp, InternalText, Plugin, Result, Test]
    Harness: []
    IntegrationFixture: [InternalWire]
    Doubles: [Expect, Harness, InternalFilesystem, InternalPhp, Result, Test]
    Sandbox: [Harness, InternalPhp, InternalProcess]
    Coverage: [InternalWire]
    CoverageCollection: [Coverage]
    CoverageDiff: [Coverage]
    CoverageAttribution: [Coverage, CoverageIgnore, DiscoveryPlan, InternalPhp, Test]
    CoverageExport: [Coverage, InternalPhp, InternalText]
    CoverageIgnore: [Coverage, InternalPhp]
    CoverageRelay: [Coverage, CoverageCollection, CoverageExport, InternalPhp]
    Plugin: [Artifact, Event, Harness, IntegrationFixture, Reporting, Result, Test]
    Reporting: [Artifact, Event, InternalEvent, InternalPhp, InternalText, Result, Test]
    ReportingProfile: [Event, Reporting]
    Execution: [Artifact, Config, Coverage, CoverageAttribution, Discovery, DiscoveryPlan, Event, ExecutionArtifact, ExecutionPlugin, IntegrationFixture, InternalWire, Reporting, Result, Test]
    ExecutionAdapter: [Artifact, Config, Coverage, CoverageAttribution, CoverageCollection, DiscoveryPlan, Event, Execution, ExecutionArtifact, ExecutionPlugin, ExecutionProcessOrchestrator, ExecutionWorker, InternalProcess, InternalWire, Plugin, Reporting, Result, Test]
    ExecutionArtifact: [Artifact, Attribute, Config, Event, InternalPhp, InternalText, InternalWire, Result, Test]
    ExecutionPlugin: [Event, Expect, Harness, IntegrationFixture, Plugin, Result, Test]
    ExecutionWorker: [Artifact, Attribute, Condition, CoverageAttribution, CoverageCollection, DiscoveryPlan, Doubles, Event, ExecutionArtifact, ExecutionPlugin, Expect, Harness, IntegrationFixture, InternalPhp, InternalText, Plugin, Result, Sandbox, Test, TestDataSet]
    ExecutionProcessProtocol: [Attribute, Config, Coverage, DiscoveryPlan, Event, ExecutionArtifact, IntegrationFixture, InternalEvent, InternalPhp, InternalWire, Result, Test]
    ExecutionProcessWorker: [Config, Coverage, CoverageAttribution, CoverageCollection, Event, ExecutionArtifact, ExecutionPlugin, ExecutionProcessProtocol, ExecutionWorker, Harness, InternalPhp, InternalWire, Plugin, Result, Test]
    ExecutionProcessOrchestrator: [Artifact, Config, Coverage, CoverageAttribution, CoverageCollection, DiscoveryPlan, Event, ExecutionArtifact, ExecutionProcessProtocol, ExecutionWorker, IntegrationFixture, InternalPhp, InternalProcess, InternalText, InternalWire, Reporting, Result, Test]
    Cli: [CliCommand, CliOutput, Coverage, CoverageRelay, ExecutionProcessProtocol, ExecutionProcessWorker, InternalWire, Reporting]
    CliInput: []
    CliConfiguration: [CliInput, Config, InternalPhp, InternalText, Result, Test]
    CliDiscovery: [CliConfiguration, Config, Discovery, DiscoveryPlan]
    CliOutput: [InternalPhp, InternalText, Reporting]
    CliReporting: [CliInput, CliOutput, Event, InternalPhp, Plugin, Reporting, ReportingProfile]
    CliCoverage: [CliConfiguration, CliOutput, Config, Coverage, CoverageCollection, CoverageExport, CoverageRelay, InternalFilesystem, InternalPhp, Reporting]
    CliSignal: [InternalProcess]
    CliState: [InternalFilesystem, InternalPhp]
    CliWatch: [CliOutput, CoverageAttribution, Discovery, DiscoveryPlan, Event, InternalPhp, InternalProcess, Test]
    CliWorkerCapacity: [Attribute, CpuCoreCounter, InternalPhp, InternalText]
    CliCommand: [CliConfiguration, CliDiscovery, CliInput, CliOutput, CliRun, Config, Coverage, CoverageDiff, CoverageExport, Discovery, DiscoveryPlan, Event, InternalEvent, InternalFilesystem, InternalPhp, InternalWire, PhpStan, Reporting, ReportingProfile]
    CliRun: [Artifact, CliConfiguration, CliCoverage, CliDiscovery, CliInput, CliOutput, CliReporting, CliSignal, CliState, CliWatch, CliWorkerCapacity, Config, Coverage, CoverageAttribution, CoverageCollection, CoverageIgnore, CoverageRelay, Discovery, Event, Execution, ExecutionAdapter, ExecutionWorker, IntegrationFixture, InternalPhp, InternalProcess, Reporting, Test]
    PhpStan: [Attribute, Condition, Config, Doubles, Expect, InternalPhp, Test, PhpStanFramework, PhpParserFramework]
    Rector: [Attribute, Condition, Expect, Test, PhpParserFramework, RectorFramework]
    Documentation: []
    Symfony: [Harness, Plugin, Result, SymfonyFramework]
    Laravel: [Harness, InternalPhp, InternalProcess, Plugin, Result, LaravelFramework]
    Hyperf: [Harness, InternalPhp, Plugin, HyperfFramework, PsrContainerFramework, SwooleFramework, ComposerRuntime]
    Psr11: [Harness, Plugin, Result, PsrContainerFramework]
    Psr15: [Harness, Plugin, PsrHttpFramework]
    Tempest: [Harness, InternalProcess, Plugin, Result, Test, TempestFramework]
    PhpStanFramework: []
    SymfonyFramework: []
    LaravelFramework: []
    HyperfFramework: []
    SwooleFramework: []
    ComposerRuntime: []
    PsrContainerFramework: []
    PsrHttpFramework: []
    TempestFramework: []
    CpuCoreCounter: []
    PhpParserFramework: []
    RectorFramework: []
